name: clearguard
description: >
  ClearGuard blocks pornographic content at the DNS and on-screen level, and
  makes it hard for the device owner to silently disable protection by
  gating every sensitive change behind a delay and an accountability
  partner notification.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  crypto: ^3.0.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^9.2.2
  flutter_timezone: ^5.1.0
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  timezone: ^0.11.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/blocklist/domains.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
